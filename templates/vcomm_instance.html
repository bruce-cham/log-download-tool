<body>
    <div class="header">
        <h1>📊 VCOMM 实例查询</h1>
        <p>查询 VCOMM 表数据 | 支持 Output 字段模糊搜索</p>
    </div>

    <div class="nav-bar">
        <a href="/">← 返回日志下载工具</a>
    </div>

    <div class="container">
        <!-- 查询条件 -->
        <div class="card">
            <div class="card-header">
                <span>🔍 查询条件</span>
            </div>
            <div class="card-body">
                <div class="filter-group">
                    <div class="filter-item">
                        <label>Output 模糊搜索</label>
                        <input type="text" id="searchKeyword" placeholder="输入关键字..." style="width: 300px;">
                    </div>
                    <div class="filter-item">
                        <label>组件筛选</label>
                        <select id="filterComponent">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <label>状态筛选</label>
                        <select id="filterStatus">
                            <option value="">全部</option>
                        </select>
                    </div>
                    <div class="filter-item">
                        <button class="btn btn-primary" onclick="searchVCOMM()">🔍 查询</button>
                        <button class="btn btn-outline" onclick="resetSearch()">重置</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 查询结果 -->
        <div class="card">
            <div class="card-header">
                <span>📋 查询结果</span>
                <span class="result-count" id="resultCount">共 0 条记录</span>
            </div>
            <div class="card-body" style="padding:0;">
                <div class="table-wrapper">
                    <table class="data-table" id="resultTable">
                        <thead>
                            <tr>
                                <th>IP</th>
                                <th>项目/环境/应用</th>
                                <th>组件</th>
                                <th>状态</th>
                                <th>Output</th>
                                <th>Error</th>
                            </tr>
                        </thead>
                        <tbody id="resultBody">
                            <tr><td colspan="6" class="loading">请输入关键字后查询</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 加载筛选选项
        async function loadFilterOptions() {
            try {
                const resp = await fetch('/api/vcomm/filter_options');
                const data = await resp.json();
                
                if (data.success) {
                    const componentSelect = document.getElementById('filterComponent');
                    const statusSelect = document.getElementById('filterStatus');
                    
                    componentSelect.innerHTML = '<option value="">全部</option>' + 
                        data.components.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
                    
                    statusSelect.innerHTML = '<option value="">全部</option>' + 
                        data.statuses.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
                }
            } catch (err) {
                console.error('加载筛选选项失败:', err);
            }
        }

        // 查询 VCOMM 数据
        async function searchVCOMM() {
            const keyword = document.getElementById('searchKeyword').value.trim();
            const filterComponent = document.getElementById('filterComponent').value;
            const filterStatus = document.getElementById('filterStatus').value;
            
            if (!keyword) {
                alert('请输入搜索关键字');
                return;
            }
            
            const tbody = document.getElementById('resultBody');
            tbody.innerHTML = '<tr><td colspan="6" class="loading">查询中...</td></tr>';
            
            try {
                const resp = await fetch('/api/vcomm/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ keyword: keyword })
                });
                const result = await resp.json();
                
                if (result.success) {
                    let data = result.data;
                    
                    // 前端二次筛选（组件和状态）
                    if (filterComponent) {
                        data = data.filter(item => item.Component === filterComponent);
                    }
                    if (filterStatus) {
                        data = data.filter(item => item.Status === filterStatus);
                    }
                    
                    displayResults(data);
                    document.getElementById('resultCount').innerText = `共 ${data.length} 条记录`;
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="loading">查询失败: ${escapeHtml(result.error)}</td></tr>`;
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="6" class="loading">请求失败: ${escapeHtml(err.message)}</td></tr>`;
            }
        }

        // 显示结果
        function displayResults(data) {
            const tbody = document.getElementById('resultBody');
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">未找到匹配记录</td></tr>';
                return;
            }
            
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td><code>${escapeHtml(item.IP || '-')}</code></td>
                    <td>${escapeHtml(item['Project/Environment/Application'] || '-')}</td>
                    <td>${escapeHtml(item.Component || '-')}</td>
                    <td>${getStatusBadge(item.Status)}</td>
                    <td class="output-cell"><pre style="margin:0; white-space:pre-wrap; font-family:monospace; font-size:11px;">${escapeHtml(item.Output || '-')}</pre></td>
                    <td class="error-cell"><pre style="margin:0; white-space:pre-wrap; font-family:monospace; font-size:11px; color:#dc3545;">${escapeHtml(item.Error || '-')}</pre></td>
                </table>
            `).join('');
        }

        // 获取状态徽章
        function getStatusBadge(status) {
            if (!status) return '-';
            const statusLower = status.toLowerCase();
            if (statusLower.includes('success') || statusLower.includes('成功')) {
                return `<span class="badge badge-success">${escapeHtml(status)}</span>`;
            } else if (statusLower.includes('fail') || statusLower.includes('失败') || statusLower.includes('error')) {
                return `<span class="badge badge-failed">${escapeHtml(status)}</span>`;
            } else if (statusLower.includes('warn') || statusLower.includes('警告')) {
                return `<span class="badge badge-warning">${escapeHtml(status)}</span>`;
            } else {
                return `<span class="badge badge-info">${escapeHtml(status)}</span>`;
            }
        }

        // 重置查询
        function resetSearch() {
            document.getElementById('searchKeyword').value = '';
            document.getElementById('filterComponent').value = '';
            document.getElementById('filterStatus').value = '';
            document.getElementById('resultBody').innerHTML = '<tr><td colspan="6" class="loading">请输入关键字后查询</td></tr>';
            document.getElementById('resultCount').innerText = '共 0 条记录';
        }

        // 回车键查询
        document.getElementById('searchKeyword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchVCOMM();
            }
        });

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // 初始化
        loadFilterOptions();
    </script>
</body>
</html>
